<!DOCTYPE html>
<html lang="en" class="unloaded">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Gianluca Colombo — Student</title>
  <meta name="description" content="Gianluca Colombo — Computer science student and mobile/web developer. Selected skills, work experience and contacts." />
  <meta name="author" content="Gianluca Colombo" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gianluca Colombo — Student" />
  <meta property="og:description" content="Computer science student and mobile/web developer. Selected skills, work experience and contacts." />
  <meta property="og:locale" content="en" />
  <meta property="og:locale:alternate" content="it" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Gianluca Colombo — Student" />
  <meta name="twitter:description" content="Computer science student and mobile/web developer." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="bg"></div>
  <div id="bgFallback" aria-hidden="true"></div>
  <video id="bgVideo" autoplay muted loop playsinline aria-hidden="true">
    <source src="/video/background.mp4" type="video/mp4">
  </video>

  <!-- Lang switcher -->
  <div id="langSwitcher" role="group" aria-label="Language">
    <button class="langBtn langBtn--active" data-lang="en" aria-pressed="true">EN</button>
    <span class="langDivider" aria-hidden="true">/</span>
    <button class="langBtn" data-lang="it" aria-pressed="false">IT</button>
  </div>

  <div class="wrapper fadeOnLoad">
    <div class="siteMeta">
      <h1 class="siteTitle">Gianluca <br class="nameBreak">Colombo,<br>Student</h1>

      <nav id="nav" aria-label="Sections">

        <div class="expandablePanel" id="aboutPanel">
          <button class="navLink expandablePanelTrigger" data-panel="aboutPanel" aria-expanded="false" aria-controls="aboutPanel-content">About</button>
          <div class="expandablePanelContentContainer" id="aboutPanel-content" role="region">
            <div class="expandablePanelContent smallerText">
              <div id="aboutSectionContent"></div>
            </div>
          </div>
        </div>

        <div class="expandablePanel" id="workPanel">
          <button class="navLink expandablePanelTrigger" data-panel="workPanel" aria-expanded="false" aria-controls="workPanel-content">Selected Work</button>
          <div class="expandablePanelContentContainer" id="workPanel-content" role="region">
            <div class="expandablePanelContent">
              <div id="projects"></div>
            </div>
          </div>
        </div>

        <div class="expandablePanel" id="projectsPanel">
          <button class="navLink expandablePanelTrigger" data-panel="projectsPanel" aria-expanded="false" aria-controls="projectsPanel-content">Projects</button>
          <div class="expandablePanelContentContainer" id="projectsPanel-content" role="region">
            <div class="expandablePanelContent">
              <div id="selectedProjects"></div>
            </div>
          </div>
        </div>

        <div class="expandablePanel" id="experiencePanel">
          <button class="navLink expandablePanelTrigger" data-panel="experiencePanel" aria-expanded="false" aria-controls="experiencePanel-content">Work Experience</button>
          <div class="expandablePanelContentContainer" id="experiencePanel-content" role="region">
            <div class="expandablePanelContent">
              <div id="experience"></div>
            </div>
          </div>
        </div>

        <div class="expandablePanel" id="contactPanel">
          <button class="navLink expandablePanelTrigger" data-panel="contactPanel" aria-expanded="false" aria-controls="contactPanel-content">Contact</button>
          <div class="expandablePanelContentContainer" id="contactPanel-content" role="region">
            <div class="expandablePanelContent smallerText">
              <div id="contactLinks"></div>
            </div>
          </div>
        </div>

      </nav>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
