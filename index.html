<!DOCTYPE html>
<html lang="en" class="unloaded">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gianluca Colombo, Design + Art Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; border: 0; box-sizing: border-box; }

  :root {
    --bg: #111;
    --fg: #fff;
    --muted: rgba(255,255,255,0.3);
    --font: 'DM Sans', helvetica, sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 6.75vw;
    line-height: 1.1em;
    letter-spacing: -2px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    cursor: none;
  }

  html.unloaded { overflow: hidden; }
  a { text-decoration: none; color: inherit; cursor: none; }

  /* ─── Layout ─────────────────────────────────────── */
  .wrapper {
    margin: 40px 60px 0;
    padding-bottom: 60px;
  }

  .fadeOnLoad { opacity: 0; transition: opacity 0s; }
  body.loaded .fadeOnLoad { opacity: 1; transition: opacity 1s; }

  /* ─── Lang switcher ─────────────────────────────── */
  #langSwitcher {
    position: fixed;
    top: 40px;
    right: 60px;
    z-index: 30;
    display: flex;
    gap: 0;
    opacity: 0;
    transition: opacity 1s;
  }
  body.loaded #langSwitcher { opacity: 1; }

  .langBtn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font);
    font-size: 6.75vw;
    line-height: 1.1em;
    letter-spacing: -2px;
    cursor: none;
    padding: 0;
    transition: color .4s;
    -webkit-font-smoothing: antialiased;
  }
  .langBtn:hover { color: rgba(255,255,255,0.6); }
  .langBtn--active { color: var(--fg); }

  .langDivider {
    color: var(--muted);
    font-family: var(--font);
    font-size: 6.75vw;
    line-height: 1.1em;
    letter-spacing: -2px;
    padding: 0 0.15em;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ─── Site meta ─────────────────────────────────── */
  .siteMeta { transition: color .4s; }
  body.openPanel .siteMeta { color: var(--muted); }
  .siteTitle { display: block; line-height: 1.05; }

  #nav { margin-top: 10px; }

  .navLink {
    display: block;
    color: var(--muted);
    transition: color .4s;
    line-height: 1.15;
  }
  .navLink:hover,
  .navLink.active { color: var(--fg); }

  /* ─── Expandable panels ─────────────────────────── */
  .expandablePanelTrigger {
    color: var(--muted);
    transition: color .4s;
    display: inline-block;
    cursor: none;
  }
  .expandablePanel.open .expandablePanelTrigger { color: var(--fg); }

  .expandablePanelContentContainer {
    height: 0;
    overflow: hidden;
    transition: height .4s ease;
  }

  .expandablePanelContent {
    display: block;
    padding-top: 40px;
    padding-bottom: 60px;
    opacity: 0;
    transition: opacity .4s;
  }
  .expandablePanel.open .expandablePanelContent { opacity: 1; }

  .smallerText {
    font-size: 3vw;
    line-height: 1.3;
    letter-spacing: -1px;
    font-family: var(--font);
  }
  .smallerText p { margin-bottom: 1.4em; }
  .smallerText p:last-child { margin-bottom: 0; }
  .smallerText a { border-bottom: 1px solid currentColor; padding-bottom: 1px; }

  #aboutSectionContent { width: 87.5%; }

  /* ─── Projects ──────────────────────────────────── */
  #projects { margin-top: 80px; margin-bottom: 80px; }
  .project { margin-bottom: 120px; }

  .projectPreview {
    position: relative;
    width: 66.67%;
    display: block;
    opacity: 1;
    z-index: 10;
  }

  .projectImages {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .project.classic .projectImages { aspect-ratio: 3 / 2; }

  img.image, svg.image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  img.image.showing, svg.image.showing { opacity: 1; pointer-events: auto; }

  .projectTitle {
    display: inline-block;
    color: var(--fg);
    transition: color .4s;
    margin-bottom: 10px;
  }

  .projectDescription {
    color: var(--muted);
    width: 66.67%;
    margin-bottom: 30px;
    line-height: 1.25;
    letter-spacing: -1px;
    text-wrap: balance;
    overflow-wrap: break-word;
    hyphens: auto;
  }

  span.imageCount {
    display: block;
    margin-top: 30px;
    line-height: 1em;
    letter-spacing: 0;
    color: var(--muted);
  }

  .imageContainerTriggerHolder {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: none;
  }
  .project.multipleImages .imageContainerTriggerHolder { display: block; }

  .imageContainerTrigger {
    position: absolute;
    top: 0; bottom: 0;
    z-index: 2;
    cursor: none;
  }
  .imageContainerTrigger[data-dir="-1"] { width: 50%; left: 0; }
  .imageContainerTrigger[data-dir="1"]  { width: 50%; left: 50%; }

  /* ─── Contact ───────────────────────────────────── */
  #contactLinks { margin-top: 10px; }
  .contactLink {
    color: var(--fg);
    border-bottom: 1px solid var(--fg);
    display: inline-block;
    margin-bottom: 4px;
    transition: color .4s, border-color .4s;
  }
  .contactLink:hover { color: var(--muted); border-color: var(--muted); }

  /* ─── Custom cursor ─────────────────────────────── */
  #cursor {
    height: 47px;
    width: 30px;
    position: fixed;
    top: -200px; left: -200px;
    pointer-events: none;
    margin-left: -10px; margin-top: -10px;
    transition: transform .2s;
    filter: drop-shadow(0 0 5px rgba(0,0,0,.5));
    transform: rotate(-22.5deg);
    z-index: 50;
  }
  @media (hover: none) { #cursor { display: none !important; } }

  /* ─── Responsive ────────────────────────────────── */
  @media (max-width: 1100px) {
    .wrapper { margin-left: 40px; margin-right: 40px; margin-top: 30px; padding-bottom: 30px; }
    #soundController, #langSwitcher { right: 40px; }
    #soundController { bottom: 20px; }
    .smallerText { font-size: 3.5vw; }
  }
  @media (max-width: 950px) {
    html, body { font-size: 7.5vw; line-height: 1.2em; }
    .langBtn, .langDivider { font-size: 7.5vw; }
    .smallerText { font-size: 4.5vw; }
  }
  @media (max-width: 600px) {
    .wrapper { margin-left: 25px; margin-right: 25px; margin-top: 20px; }
    html, body { font-size: 12vw; line-height: 1.2em; }
    .langBtn, .langDivider { font-size: 12vw; }
    #langSwitcher { top: 20px; right: 25px; }
    .projectPreview { width: 100%; }
    .projectDescription { width: 100%; margin-bottom: 20px; }
    span.imageCount { margin-top: 20px; }
    .project { margin-bottom: 60px; }
    #aboutSectionContent { width: 100%; }
    .smallerText { font-size: 5.75vw; line-height: 1.3; }
    .imageContainerTrigger[data-dir="-1"] { display: none; }
    .imageContainerTrigger[data-dir="1"]  { width: 100%; left: 0; }
  }
</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor">
  <svg viewBox="0 0 30 47" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 2L2 40L10 32L16 45L20 43L14 30L26 30L2 2Z" fill="white" stroke="black" stroke-width="1.5"/>
  </svg>
</div>

<!-- Lang switcher -->
<div id="langSwitcher">
  <button class="langBtn langBtn--active" data-lang="en">EN</button>
  <span class="langDivider">/</span>
  <button class="langBtn" data-lang="it">IT</button>
</div>

<div class="wrapper fadeOnLoad">
  <div class="siteMeta">
    <span class="siteTitle">Gianluca Colombo,<br>Studente + developer</span>

    <nav id="nav">
      <div class="expandablePanel" id="aboutPanel">
        <a class="navLink expandablePanelTrigger" href="#" data-panel="aboutPanel">About</a>
        <div class="expandablePanelContentContainer">
          <div class="expandablePanelContent smallerText">
            <div id="aboutSectionContent"></div>
          </div>
        </div>
      </div>

      <div class="expandablePanel" id="workPanel">
        <a class="navLink expandablePanelTrigger" href="#" data-panel="workPanel">Selected Work</a>
        <div class="expandablePanelContentContainer">
          <div class="expandablePanelContent">
            <div id="projects"></div>
          </div>
        </div>
      </div>

      <div class="expandablePanel" id="contactPanel">
        <a class="navLink expandablePanelTrigger" href="#" data-panel="contactPanel">Contact</a>
        <div class="expandablePanelContentContainer">
          <div class="expandablePanelContent smallerText">
            <div id="contactLinks"></div>
          </div>
        </div>
      </div>
    </nav>
  </div>
</div>

<script>
// ─── compiled from TypeScript ─────────────────────────────────────────────────
// src/translations.ts → src/main.ts
// tsc --target ES2020 --strict

const translations = {
  en: {
    nav: { about: 'About', work: 'Selected Work', contact: 'Contact' },
    about: {
      intro: "I'm a multidisciplinary designer and art director currently based in San Francisco. My experience includes in-house and agency teams with work ranging from marketing, visual, brand, editorial, and environmental design.",
      experience: 'Previously I have worked with folks at <a href="#">Airbnb</a>, <a href="#">Apple</a>, <a href="#">Google</a>, <a href="#">IDEO</a>, <a href="#">Figma</a>, and interned at <a href="#">Pentagram</a> and <a href="#">2x4</a>. I studied architecture at <a href="#">Yale</a> and <a href="#">Princeton</a> and run a <a href="#">Sea Ranch stay</a> that is a design-focused retreat experience.',
      closing: 'Please reach out for opportunities, collaborations, and thanks for stopping by.',
    },
    contact: { email: 'Email', linkedin: 'LinkedIn', instagram: 'Instagram' },
    sound: 'Sound',
    imageOf: (current, total) => `${current} / ${total}`,
    projects: [
      { id: 'proj1', title: 'Brand Identity — Airbnb',         description: 'Visual identity and brand system for a global hospitality platform, spanning digital, environmental, and print touchpoints.', imageCount: 3 },
      { id: 'proj2', title: 'Editorial Design — Apple',        description: 'Campaign and editorial direction for product launches, retail activations, and digital marketing materials.',                 imageCount: 2, classic: true },
      { id: 'proj3', title: 'Environmental Design — Google',   description: 'Wayfinding, signage systems, and spatial branding for campus environments and event spaces.',                                imageCount: 1 },
      { id: 'proj4', title: 'Design Strategy — IDEO',          description: 'Human-centered design research and visual systems for healthcare and consumer experience projects.',                         imageCount: 2 },
    ],
  },
  it: {
    nav: { about: 'Chi sono', work: 'Lavori selezionati', contact: 'Contatti' },
    about: {
      intro: 'Sono un designer e art director multidisciplinare con base a San Francisco. La mia esperienza spazia tra team interni e agenzie, con lavori che vanno dal marketing al design visivo, di brand, editoriale e ambientale.',
      experience: 'In precedenza ho collaborato con <a href="#">Airbnb</a>, <a href="#">Apple</a>, <a href="#">Google</a>, <a href="#">IDEO</a>, <a href="#">Figma</a>, e ho svolto tirocini presso <a href="#">Pentagram</a> e <a href="#">2x4</a>. Ho studiato architettura a <a href="#">Yale</a> e <a href="#">Princeton</a> e gestisco un <a href="#">soggiorno al Sea Ranch</a>, un\'esperienza di ritiro incentrata sul design.',
      closing: 'Contattami per opportunità, collaborazioni — grazie per essere passato.',
    },
    contact: { email: 'Email', linkedin: 'LinkedIn', instagram: 'Instagram' },
    sound: 'Suono',
    imageOf: (current, total) => `${current} / ${total}`,
    projects: [
      { id: 'proj1', title: 'Identità di brand — Airbnb',     description: 'Sistema di identità visiva per una piattaforma di ospitalità globale, che copre touchpoint digitali, ambientali e di stampa.', imageCount: 3 },
      { id: 'proj2', title: 'Design editoriale — Apple',      description: 'Direzione creativa e campagne per lanci di prodotto, attivazioni retail e materiali di marketing digitale.',                    imageCount: 2, classic: true },
      { id: 'proj3', title: 'Design ambientale — Google',     description: 'Wayfinding, sistemi di segnaletica e branding spaziale per campus e spazi eventi.',                                            imageCount: 1 },
      { id: 'proj4', title: 'Strategia di design — IDEO',     description: "Ricerca di design centrata sull'utente e sistemi visivi per progetti nel settore sanitario e dell'esperienza consumer.",        imageCount: 2 },
    ],
  },
};

// ─── State ────────────────────────────────────────────────────────────────────
let currentLang = (localStorage.getItem('lang') ?? 'en');
let soundOn = false;
const imageIndexes = {};

// ─── DOM helpers ──────────────────────────────────────────────────────────────
function qs(sel, root = document) {
  const el = root.querySelector(sel);
  if (!el) throw new Error(`Element not found: ${sel}`);
  return el;
}
function qsAll(sel, root = document) {
  return Array.from(root.querySelectorAll(sel));
}

// ─── Cursor ───────────────────────────────────────────────────────────────────
function initCursor() {
  const cursor = qs('#cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = `${e.clientX}px`;
    cursor.style.top  = `${e.clientY}px`;
  });
}

// ─── Expandable panels ────────────────────────────────────────────────────────
function openPanel(panelEl) {
  const container = qs('.expandablePanelContentContainer', panelEl);
  const content   = qs('.expandablePanelContent', panelEl);
  panelEl.classList.add('open');
  container.style.height = 'auto';
  const h = container.scrollHeight;
  container.style.height = '0';
  requestAnimationFrame(() => {
    container.style.transition = 'height .4s ease';
    container.style.height = `${h}px`;
    content.style.transition  = 'opacity .4s .1s';
    content.style.opacity = '1';
  });
}

function closePanel(panelEl) {
  const container = qs('.expandablePanelContentContainer', panelEl);
  const content   = qs('.expandablePanelContent', panelEl);
  panelEl.classList.remove('open');
  container.style.transition = 'height .4s ease';
  container.style.height = '0';
  content.style.transition = 'opacity .4s';
  content.style.opacity = '0';
}

function closeAllPanels() {
  qsAll('.expandablePanel.open').forEach(closePanel);
}

function initPanels() {
  qsAll('.expandablePanelTrigger').forEach(trigger => {
    trigger.addEventListener('click', (e) => {
      e.preventDefault();
      const panelId = trigger.dataset['panel'];
      if (!panelId) return;
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.contains('open');
      closeAllPanels();
      if (!isOpen) {
        openPanel(panel);
        document.body.classList.add('openPanel');
      } else {
        document.body.classList.remove('openPanel');
      }
    });
  });
}

// ─── Image cycling ────────────────────────────────────────────────────────────
function showImage(projectId, index) {
  const project = document.getElementById(projectId);
  if (!project) return;
  const images  = qsAll('.image', project);
  const countEl = project.querySelector('span.imageCount');
  images.forEach((img, i) => img.classList.toggle('showing', i === index));
  const t = translations[currentLang];
  if (countEl && images.length > 1) {
    countEl.textContent = t.imageOf(index + 1, images.length);
  }
}

function initImageCycling() {
  qsAll('.imageContainerTrigger').forEach(trigger => {
    trigger.addEventListener('click', () => {
      const projectId = trigger.dataset['project'];
      const dir = parseInt(trigger.dataset['dir'] ?? '1', 10);
      if (!projectId) return;
      const project = document.getElementById(projectId);
      if (!project) return;
      const images = qsAll('.image', project);
      if (!images.length) return;
      imageIndexes[projectId] = ((imageIndexes[projectId] ?? 0) + dir + images.length) % images.length;
      showImage(projectId, imageIndexes[projectId]);
    });
  });
}

// ─── i18n — project builder ───────────────────────────────────────────────────
function buildProjectHTML(p) {
  const multiClass   = p.imageCount > 1 ? ' multipleImages' : '';
  const classicClass = p.classic ? ' classic' : '';
  const countHTML    = p.imageCount > 1
    ? `<span class="imageCount">${translations[currentLang].imageOf(1, p.imageCount)}</span>`
    : '';

  const palette = ['#FF5A5F','#2a2a2a','#4285F4','#e63329','#0071e3','#5f5fc4'];
  const imagesHTML = Array.from({ length: p.imageCount }).map((_, i) => {
    const showClass = i === 0 ? ' showing' : '';
    const bg  = palette[(parseInt(p.id.replace('proj','')) - 1 + i) % palette.length];
    const label = p.title.split('—')[1]?.trim() ?? p.title;
    return `<svg class="image${showClass}" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
        <rect width="1600" height="900" fill="${bg}"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
          fill="white" font-size="80" font-family="helvetica" letter-spacing="-2">${label}</text>
      </svg>`;
  }).join('\n');

  const triggersHTML = p.imageCount > 1 ? `
      <div class="imageContainerTriggerHolder">
        <div class="imageContainerTrigger" data-project="${p.id}" data-dir="-1"></div>
        <div class="imageContainerTrigger" data-project="${p.id}" data-dir="1"></div>
      </div>` : '';

  return `
    <div class="project${multiClass}${classicClass}" id="${p.id}">
      <a class="projectTitle" href="#">${p.title}</a>
      <p class="projectDescription">${p.description}</p>
      <div class="projectPreview">
        <div class="projectImages">
          ${triggersHTML}
          ${imagesHTML}
        </div>
      </div>
      ${countHTML}
    </div>`;
}

// ─── Apply translations to DOM ────────────────────────────────────────────────
function applyTranslations(lang) {
  const t = translations[lang];

  // nav
  const navAbout   = document.querySelector('[data-panel="aboutPanel"]');
  const navWork    = document.querySelector('[data-panel="workPanel"]');
  const navContact = document.querySelector('[data-panel="contactPanel"]');
  if (navAbout)   navAbout.textContent   = t.nav.about;
  if (navWork)    navWork.textContent    = t.nav.work;
  if (navContact) navContact.textContent = t.nav.contact;

  // about
  const aboutContent = document.getElementById('aboutSectionContent');
  if (aboutContent) {
    aboutContent.innerHTML = `
      <div>
        <p>${t.about.intro}</p>
        <p>${t.about.experience}</p>
        <p>${t.about.closing}</p>
      </div>`;
  }

  // contact
  const contactLinks = document.getElementById('contactLinks');
  if (contactLinks) {
    contactLinks.innerHTML = `
      <a href="mailto:hello@josemeza.com" class="contactLink">${t.contact.email}</a><br>
      <a href="https://linkedin.com" class="contactLink">${t.contact.linkedin}</a><br>
      <a href="https://instagram.com" class="contactLink">${t.contact.instagram}</a>`;
  }

  // sound
  const soundEl = document.getElementById('soundController');
  if (soundEl) soundEl.textContent = t.sound;

  // projects
  const projectsEl = document.getElementById('projects');
  if (projectsEl) {
    projectsEl.innerHTML = t.projects.map(buildProjectHTML).join('\n');
  }

  // re-init cycling after DOM rebuild + reset indexes
  initImageCycling();
  t.projects.forEach(p => { imageIndexes[p.id] = 0; });

  // lang buttons
  document.querySelectorAll('.langBtn').forEach(btn => {
    btn.classList.toggle('langBtn--active', btn.dataset['lang'] === lang);
  });

  // update <html lang>
  document.documentElement.lang = lang;
}

// ─── Lang switcher ────────────────────────────────────────────────────────────
function initLangSwitcher() {
  document.querySelectorAll('.langBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset['lang'];
      if (!lang || lang === currentLang) return;
      currentLang = lang;
      localStorage.setItem('lang', lang);
      applyTranslations(lang);

      // re-measure any open panels after content change
      qsAll('.expandablePanel.open').forEach(panel => {
        const container = qs('.expandablePanelContentContainer', panel);
        container.style.height = 'auto';
        const h = container.scrollHeight;
        container.style.height = `${h}px`;
      });
    });
  });
}

// ─── Bootstrap ────────────────────────────────────────────────────────────────
function init() {
  applyTranslations(currentLang);
  initCursor();
  initPanels();
  initLangSwitcher();

  window.addEventListener('load', () => {
    document.documentElement.classList.remove('unloaded');
    setTimeout(() => document.body.classList.add('loaded'), 50);
  });
}

init();
</script>
</body>
</html>
